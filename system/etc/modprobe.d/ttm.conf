# Ceiling for the shared RAM the iGPU may address, ~26 GB, so a large MoE model
# fits entirely in GPU memory instead of spilling to CPU. Raised from 24 GB to
# cover a 23 GB weight set plus KV cache. This is the VRAM-side fix; never solve
# spillover by lowering the context length.
options ttm pages_limit=6815744 page_pool_size=6815744
