# pages_limit is the ceiling on shared RAM the iGPU may address, 24 GB, which
# holds a 23 GB MoE model entirely in GPU memory instead of spilling to the CPU.
# This is the VRAM-side fix; never solve spillover by lowering the context.
# The kernel caps this at boot regardless of a higher value here, so 24 GB is
# what it actually applies.
#
# page_pool_size is a cache of freed pages, not a second ceiling. Leaving it
# equal to pages_limit makes TTM hoard everything the GPU ever touched: after a
# 23 GB model unloads the memory is never returned, the desktop is left with
# about a gigabyte and the session freezes in direct reclaim. Keep it small.
options ttm pages_limit=6291456 page_pool_size=131072
