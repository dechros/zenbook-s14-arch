# Freeze capture: on a hard freeze, the last log lines not yet written to the
# journal are lost. A low SyncIntervalSec flushes the breadcrumbs before the
# freeze to disk with at most ~1s of loss. SystemMaxUse caps the persistent
# journal so it can never fill the disk. Storage is persistent.
[Journal]
Storage=persistent
SyncIntervalSec=1s
SystemMaxUse=500M
