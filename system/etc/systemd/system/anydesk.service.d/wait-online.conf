# On boot anydesk.service started before the network was up: it couldn't reach
# the relay and showed "AnyDesk not connected" for minutes while it timed out.
# Fix: order the service after network-online.target and, before starting, wait
# for REAL internet access. Measured: on a ready network the relay connects in
# ~10s; nm-online alone returns the moment NM says "connected", but with no real
# internet yet the anydesk relay TCP times out -> ~2min backoff. So after
# nm-online we wait until connectivity is ACTUALLY "full" (active probe, ~60s
# cap); then anydesk starts and connects on the first try.
# (Rather than enabling NetworkManager-wait-online globally and slowing every
#  boot, the wait is scoped to this service only; being a background service it
#  does not hold up login.)
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStartPre=/usr/bin/nm-online -t 30 -q
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 30 ]; do [ "$(nmcli networking connectivity check 2>/dev/null)" = "full" ] && exit 0; i=$((i+1)); sleep 2; done'
