# On boot (Persistent timer catch-up) it ran while DNS was not ready yet despite
# network-online and failed with "Could not resolve host: geoip.kde.org".
# Wait until real connectivity + DNS resolution are ready (bounded ~60s).
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 30 ]; do [ "$(nmcli networking connectivity check 2>/dev/null)" = "full" ] && getent hosts geoip.kde.org >/dev/null 2>&1 && break; i=$((i+1)); sleep 2; done; exit 0'
