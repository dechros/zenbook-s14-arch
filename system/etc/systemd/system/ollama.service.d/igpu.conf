# Lunar Lake Arc 140V: ollama iGPU'lari varsayilan olarak eler ("dropping integrated
# GPU"). Bu makinede dGPU yok, iGPU + LPDDR5X tek secenek.
# NOT: OLLAMA_FLASH_ATTENTION=1 ve KV_CACHE_TYPE=q8_0 olculdu ve YAVASLATTI
# (prefill 68->60, gen 14.9->11.1 tok/s) - Intel Vulkan backend'inde FA verimsiz. Acma.
[Service]
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_CONTEXT_LENGTH=65536"
