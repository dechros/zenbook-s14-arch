# Benchmarked 2026-09-13 across gpt-oss-20b, Qwen3.8-27b, Qwen3.6-27b and
# Qwen3.6-35b-a3b: flash attention with a q8_0 KV cache costs no measurable
# speed (0-2%, within noise) and saves memory, so both stay on.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
