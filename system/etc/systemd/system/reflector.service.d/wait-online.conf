# reflector.timer is a Persistent timer: on boot/resume catch-up, even once
# network-online looks up, DNS was not ready yet and it failed with
#   "failed to retrieve mirrorstatus data: URLError ... Temporary failure in name resolution"
# (showed up as a failed unit). Same fix as cachyos-rate-mirrors: wait until real
# connectivity + DNS resolution are ready (bounded ~60s), then reflector starts
# and pulls the mirrorstatus on the first try.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 30 ]; do [ "$(nmcli networking connectivity check 2>/dev/null)" = "full" ] && getent hosts archlinux.org >/dev/null 2>&1 && break; i=$((i+1)); sleep 2; done; exit 0'
