# reflector.timer bir Persistent timer: boot/resume'da catch-up ile network-online
# gorunse bile DNS henuz hazir degilken calisip
#   "failed to retrieve mirrorstatus data: URLError ... Temporary failure in name resolution"
# ile fail oluyordu (failed unit olarak gorunuyordu). cachyos-rate-mirrors ile ayni
# cozum: gercek connectivity + DNS cozumu hazir olana kadar bekle (bounded ~60s),
# sonra reflector basar ve ilk denemede mirrorstatus'u ceker.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 30 ]; do [ "$(nmcli networking connectivity check 2>/dev/null)" = "full" ] && getent hosts archlinux.org >/dev/null 2>&1 && break; i=$((i+1)); sleep 2; done; exit 0'
