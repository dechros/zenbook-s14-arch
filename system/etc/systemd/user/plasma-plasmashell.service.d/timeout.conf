# On logout/shutdown plasmashell sometimes ignores SIGTERM and wedges its event
# loop (depends on uptime/tray-client state, not deterministic; observed once
# after 15h uptime). systemd's default TimeoutStopSec=40s waited the full time
# then SIGKILLed it -> a ~40s shutdown stall (everything else in shutdown took
# 3s). Drop the timeout to 10s: leaves plenty of room for a clean exit, only
# kicks in on a real wedge. 10s (not 2-3s) because a SIGKILL can cut off the
# write of plasma-org.kde.plasma.desktop-appletsrc and lose panel/applet layout
# changes; 10s guarantees a clean exit.
[Service]
TimeoutStopSec=10s
