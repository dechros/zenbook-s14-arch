# Logout/shutdown'da plasmashell bazen SIGTERM'e cevap vermeyip event loop'ta
# kilitleniyor (uptime/tray-client state'ine bagli, deterministik degil; olculen
# bir vakada 15h uptime sonrasi). systemd default TimeoutStopSec=40s tamamen
# bekleyip SIGKILL ediyordu -> ~40sn'lik kapanma takilmasi (kapanmanin geri kalan
# her seyi 3sn). Timeout'u 10sn'ye cekiyoruz: normal temiz cikis icin bol yer
# birakir, sadece gercekten wedge oldugunda devreye girer. 10s (2-3s degil) cunku
# SIGKILL plasma-org.kde.plasma.desktop-appletsrc yazimini yarida kesip panel/applet
# layout degisikligini dusurabilir; 10s temiz cikisi garantiler.
[Service]
TimeoutStopSec=10s
