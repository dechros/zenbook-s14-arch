# reflector.timer (weekly) automatically selects the fastest/most up-to-date Arch
# mirrors, so a single slow mirror does not cause an "Operation too slow" error.
# (CachyOS mirrors are also ranked automatically by cachyos-rate-mirrors.timer.)
--save /etc/pacman.d/mirrorlist
--protocol https
--country Turkey,Germany,Netherlands,France,Bulgaria,Romania
--latest 20
--sort rate
