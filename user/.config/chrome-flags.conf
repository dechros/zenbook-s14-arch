--ozone-platform-hint=auto
--enable-features=WaylandWindowDecorations
--disable-high-precision-scrolling
--disable-smooth-scrolling
# A fixed store; a kwallet race otherwise drops the Google session on restart.
--password-store=basic
# The portal Secret key does not persist without kwallet.
--disable-features=DbusSecretPortal,SecretPortalKeyProviderUseForEncryption
