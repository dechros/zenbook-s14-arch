--ozone-platform-hint=auto
--enable-features=WaylandWindowDecorations
--disable-high-precision-scrolling
--disable-smooth-scrolling
# On Wayland login, a race with kwallet made Chrome encrypt cookies/tokens with
# either the basic (v10) or the kwallet (v11) key; on the next launch it couldn't
# decrypt the ones sealed with the other key -> "Failed to decrypt token" and the
# Google session dropped every start. A fixed, deterministic store removes the
# keyring dependency/race and keeps the session persistent.
--password-store=basic
