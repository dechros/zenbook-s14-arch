--ozone-platform-hint=auto
--enable-features=WaylandWindowDecorations
--disable-high-precision-scrolling
--disable-smooth-scrolling
# Wayland login'de kwallet ile yaris yuzunden Chrome cookie/token'lari kah basic
# (v10) kah kwallet (v11) anahtariyla sifreliyor; sonraki acilista diger anahtarla
# olani cozemeyip "Failed to decrypt token" -> Google oturumu her acilista dusuyordu.
# Sabit deterministik depo: keyring bagimliligi/yaris ortadan kalkar, kalici oturum.
--password-store=basic
